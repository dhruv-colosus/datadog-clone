# ----------------------------------------------------------------
# MAIN CONTENT — /help/quick_start?tab=infrastructure
# ----------------------------------------------------------------
main_content:
  route: /help/quick_start
  query_params:
    tab: infrastructure        # also: services | frontend | integrations
  layout: split_pane            # left: tab cards, right: tab detail

  header:
    avatar: green_pixel_robot
    title: "Welcome, Vedanta!"
    subtitle: "Let's start monitoring your entire stack"
    trial_banner:
      icon: clock
      text: "You have 13 days left in your trial"
      cta:
        label: "Upgrade to Paid"
        style: link

  left_pane:
    type: vertical_card_tabs
    tabs:
      - id: infrastructure
        title: Infrastructure
        icon: server
        status_badge: { text: "NO AGENT DETECTED", tone: warning }
        selected_default: true
      - id: services
        title: Services
        icon: flow
        status_badge: { text: "APM DISABLED", tone: neutral }
      - id: frontend
        title: Frontend
        icon: monitor
        status_badge: { text: "RUM DETECTED", tone: success }
      - id: integrations
        title: Integrations
        icon: puzzle
        status_badges:
          - { text: "NO CLOUD PROVIDER",       tone: neutral }
          - { text: "NO SOURCE CODE PROVIDER", tone: neutral }

  right_pane:
    # Content below shown when tab=infrastructure
    state: empty
    icon: spinner_dot
    heading: "No Infrastructure Detected"
    primary_cta:
      label: "Install Your First Agent"
      style: solid_purple
      icon_trailing: external
    body: >
      With the Agent installed, you can monitor all your infrastructure
      with real-time metrics like CPU, memory, disk, & network usage.
    sub_heading: "Once the Agent is installed, your data will show up here."
    preview:
      type: screenshot_card
      caption: "Your first host is live!"
      meta: "i-0b0b67c2d073ea • Linux • 1 CPU • 8GB Memory • 100 GB Disk • 10.82.134.172"
      panels:
        - { title: "CPU usage (%)" }
        - { title: "Processes memory usage" }
        - { title: "Disk usage" }
      footer: "We detected these running services"

  footer:
    copyright: "Copyright Datadog, Inc. 2026"
    build: "35.111034500"
    links:
      - "Master Subscription Agreement"
      - "Privacy Policy"
      - "Cookie Policy"
      - "Datadog Status →"
    status_indicator:
      dot: green
      text: "All Systems Operational"

# ----------------------------------------------------------------
# DESIGN TOKENS (rough — refine from screenshots)
# ----------------------------------------------------------------
tokens:
  colors:
    sidebar_bg:        "#1B1C1D"   # near-black
    sidebar_text:      "#C8CCD3"
    sidebar_text_active: "#FFFFFF"
    sidebar_active_bg: "#2B2C2E"
    flyout_bg:         "#1F2123"
    flyout_text:       "#E5E7EB"
    accent_purple:     "#7C3AED"   # Datadog purple (Install Your First Agent CTA, brand)
    badge_new_text:    "#A78BFA"
    badge_preview_text:"#A78BFA"
    body_bg:           "#FFFFFF"
    body_text:         "#1B1C1D"
    success:           "#10B981"   # green dot (RUM detected, status operational)
    warning:           "#F59E0B"   # amber (no agent)
  typography:
    font_family: "Inter, system-ui, sans-serif"
    sidebar_size: 13
    flyout_section_size: 14
    flyout_item_size: 13
  spacing:
    sidebar_width_collapsed: 160
    flyout_panel_width: 500
    main_max_width: 1200
  radii:
    card: 8
    button: 6

# ----------------------------------------------------------------
# COMPONENT NOTES (for the rebuild)
# ----------------------------------------------------------------
component_notes:
  - Sidebar items are <li> with class single-page-app_navbar_navbar-menu__list-item
  - Hover on a sidebar item opens a dark-themed flyout panel anchored to its right edge.
  - Flyout panels can have two columns (item list + side_links column) — see Monitors, On-Call, APM Traces, Synthetic Tests.
  - Section titles inside flyouts can themselves be clickable links (e.g. Live Debugger, Watchdog).
  - "+" prefix in flyouts (rendered in blue) marks "create new" actions: New Monitor, New Workflow, etc.
  - Badges: NEW (purple) and PREVIEW (purple outline) appear next to either section titles or items.
  - Bottom-left avatar block doubles as the org switcher.