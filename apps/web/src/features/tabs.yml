      icon: search
      shortcut: "⌘+K"
      type: command_palette
    - id: recent
      label: Recent
      icon: clock
      type: flyout
      sections:
        - title: Recent
          items:
            - { label: Dashboards,                     type: page }
            - { label: Metrics,                        type: page }
            - { label: Page Not Found,                 type: page }
            - { label: "Vedanta's Dashboard Fri, May 1, 3:27:30 pm", type: dashboard }
            - { label: Monitors,                       type: page }
            - { label: Investigations,                 type: page }
