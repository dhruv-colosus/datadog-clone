# Datadog Sidebar + Quick-Start UI Spec
# Source: https://app.datadoghq.com/help/quick_start?tab=infrastructure
# Captured: 2026-05-02 (logged in as vedanta@techbrig.co / TechBrig org)
# Use this YAML as the data model when cloning the Datadog frontend.

app:
  name: Datadog
  layout:
    type: shell
    regions:
      - left_sidebar          # collapsible nav (icon + label, fly-out submenus on hover)
      - main_content          # routed view; defaults here to /help/quick_start

# ----------------------------------------------------------------
# LEFT SIDEBAR
# ----------------------------------------------------------------
sidebar:
