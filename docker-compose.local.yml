# Local-dev override: web rebuilt to point its NEXT_PUBLIC_API_URL at the host-published api port.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# NOTE: .env must exist. For local, you can set COOKIE_DOMAIN=localhost, COOKIE_SECURE=false,
# FRONTEND_URL=http://localhost:3000,
# and DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/datadogdb.

services:
  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
