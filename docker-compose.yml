services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER}/datadog-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      TEST_AUTH_ENABLED: ${TEST_AUTH_ENABLED:-false}
      TEST_AUTH_EMAIL: ${TEST_AUTH_EMAIL:-playwright-e2e@example.com}
      TEST_AUTH_NAME: ${TEST_AUTH_NAME:-Playwright Test}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      BACKFILL_ON_BOOT: ${BACKFILL_ON_BOOT:-true}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-7}
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-5}
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GHCR_OWNER}/datadog-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  pgdata:
